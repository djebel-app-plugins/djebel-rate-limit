; The smart defaults: what an action does decides its budget, so most routes need no rule of their
; own. Every rule starts from the defaults section and sets only what differs; an app's rules filter
; adds or replaces a rule by its name.
; Budgets count per IP per window_seconds of the defaults section (3600, one hour), unless a rule
; sets its own.

[plugins.djebel-plugin-rate-limit.defaults]
window_seconds = 3600
subnet_max_requests_multiplier = 8
count_successes = 1
over_limit_fake_success = 0

[plugins.djebel-plugin-rate-limit.rules.sign_in]
pattern = "*/auth|*/login"
max_requests = 20
count_successes = 0
over_limit_fake_success = 1

[plugins.djebel-plugin-rate-limit.rules.account_secrets]
pattern = "*/reset_password*|*/change_password*|*/change_email*|*/verify*"
max_requests = 10
count_successes = 0
over_limit_fake_success = 1

[plugins.djebel-plugin-rate-limit.rules.lookups]
pattern = "*/check*|*/find*|*/lookup*|*/search*"
max_requests = 120

[plugins.djebel-plugin-rate-limit.rules.writes]
pattern = "*/create|*/upsert|*/save*|*/update*|*/set*|*/add*|*/delete*|*/remove*"
max_requests = 600

[plugins.djebel-plugin-rate-limit.rules.reads]
pattern = "*/get*|*/list*"
max_requests = 2400

[plugins.djebel-plugin-rate-limit.rules.any]
pattern = "*"
max_requests = 1200
